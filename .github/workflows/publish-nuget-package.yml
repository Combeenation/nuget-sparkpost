name: Publish NuGet Package

on:
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push NuGet
    runs-on: windows-2025

    permissions:
      packages: write
      contents: read

    env:
      BUILD_CONFIGURATION: Release
      PACKAGE_NAME: Combeenation.Libs.SparkPost
      PACKAGE_VERSION: ''
      PATH_TO_CSPROJ: src/SparkPost/SparkPost.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Read package version from project
        shell: pwsh
        run: |
          [xml]$project = Get-Content "${{ env.PATH_TO_CSPROJ }}"
          $version = $project.Project.PropertyGroup.Version |
                     Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                     Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "ERROR: No <Version> element found in ${{ env.PATH_TO_CSPROJ }}"
            exit 1
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using package version $version"

      - name: Add GitHub Packages NuGet source
        run: |
          dotnet nuget add source `
            --username ${{ github.actor }} `
            --password ${{ secrets.GITHUB_TOKEN }} `
            --store-password-in-clear-text `
            --name github `
            "https://nuget.pkg.github.com/Combeenation/index.json"

      - name: Restore '${{ env.PACKAGE_NAME }}'
        run: dotnet restore "${{ env.PATH_TO_CSPROJ }}"

      - name: Build '${{ env.PACKAGE_NAME }}'
        run: |
          dotnet build "${{ env.PATH_TO_CSPROJ }}" `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-restore `
            -p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack '${{ env.PACKAGE_NAME }}'
        run: |
          dotnet pack "${{ env.PATH_TO_CSPROJ }}" `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-build `
            -p:PackageVersion=${{ env.PACKAGE_VERSION }} `
            --output "${{ runner.temp }}/nupkgs"

      - name: Verify .nupkg exists
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "${{ runner.temp }}/nupkgs" -Filter "*.nupkg" -Recurse
          if ($packages.Count -eq 0) {
            Write-Error "ERROR: No .nupkg file found in ${{ runner.temp }}/nupkgs"
            exit 1
          }
          foreach ($pkg in $packages) {
            Write-Host "OK: $($pkg.FullName) ($([math]::Round($pkg.Length / 1KB, 1)) KB)"
          }

      - name: Push '${{ env.PACKAGE_NAME }}' to GitHub Packages
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem -Path "${{ runner.temp }}/nupkgs" -Filter "*.nupkg" |
                   Select-Object -First 1 -ExpandProperty FullName
          dotnet nuget push $nupkg `
            --api-key ${{ secrets.GITHUB_TOKEN }} `
            --source "https://nuget.pkg.github.com/Combeenation/index.json" `
            --skip-duplicate